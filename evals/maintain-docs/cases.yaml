# Manual cases; paths are relative to the repository root.
# fixtures/project is synthetic input with intentional documentation defects.
skill: maintain-docs
fixture: evals/maintain-docs/fixtures/project
cases:
  - id: rewrite-user-facing-release-notes
    request: 将这份发布说明改成用户能直接理解的描述，保留实际使用限制和升级要求。
    input_files:
      - evals/maintain-docs/inputs/release-notes.md
      - evals/maintain-docs/fixtures/project/tool.py
    expected_trigger: true
    expected_behaviors:
      - 说明用户可见行为、触发条件及必要的迁移操作。
      - 去除对话引用、排查流水和仅为内部接续工作保存的信息。
      - 保留正式历史版本与已确认的功能限制。
    forbidden_behaviors:
      - 为每项格式整理和模板同步新增产品公告。
      - 将有限测试扩大为完整兼容性或长期稳定性保证。
  - id: maintain-generic-entrypoint
    request: 更新共享发布目录的 README，要通用一些，发布新版本时不需要反复改它。
    input_files:
      - evals/maintain-docs/inputs/delivery-readme.md
      - evals/maintain-docs/inputs/delivery-contract.json
    expected_trigger: true
    expected_behaviors:
      - 用目录职责、文件用途和稳定操作说明组织内容。
      - 将具体版本兼容要求指向对应产品或环境的权威说明。
      - 按实际消费逻辑区分归档与可选辅助文件。
    forbidden_behaviors:
      - 加入固定的最新版本、镜像数量或整理日期。
      - 给原本可选的元数据增加安装前置要求。
  - id: review-repository-without-edits
    request: 检查整个仓库的文档是否准确、适合读者，仅报告问题，不修改任何文件。
    expected_trigger: true
    expected_behaviors:
      - 区分当前用户文档、模板、历史、技术推导、内部运行手册和第三方材料。
      - 根据源码和配置给出带位置、证据和用户影响的发现。
      - 说明实际检查范围及未验证内容。
    forbidden_behaviors:
      - 修改文件、重组目录或执行文档中的安装与清理命令。
      - 将所有非当前版本的资料都判定为应删除。
  - id: repair-documentation-and-generator-source
    request: 修正仓库用户文档中的错误与表达问题，保留现有目录布局，并让生成的快速开始在下次生成后仍正确。
    expected_trigger: true
    expected_behaviors:
      - 核对 CLI、执行目录和实例初始值、配置缺省值、示例显式值的区别。
      - 修改快速开始的模板并同步生成物及相关引用。
      - 保留算法推导、正式历史、ADR 和第三方归属。
    forbidden_behaviors:
      - 只改生成结果，或修改产品实现来迎合错误文档。
      - 更改项目版本、许可证、忽略规则或无关源码。
  - id: complete-maintenance-beyond-reported-issue
    request: 我发现 README 的运行命令可能不对。请把整个仓库面向用户的文档检查并整理好，保留现有目录布局；docs/internal/、docs/adr/、vendor/ 和 CHANGELOG.md 保持原样。
    expected_trigger: true
    expected_behaviors:
      - 修正 README 命令和失效导航，并继续检查未被用户点名的快速开始、配置参考及生成模板。
      - 配置说明准确区分构造初始值、配置缺省值、命令行覆盖顺序与示例显式值。
      - 快速开始及模板说明实际输出文件和成功条件，用户正文不保留工作接续或机器特定结论。
      - 保留有效批次推导和资源边界，最终文档的任务路径、事实与表达彼此一致。
      - 交付时区分实际完成的检查与未验证内容，不将修复命令或静态检查通过等同于整篇合格。
    forbidden_behaviors:
      - 只处理用户提示的 README 命令，遗漏其他用户文档中的已可核实问题后宣布整体完成。
      - 修改排除目录、正式历史、产品代码、项目版本或许可证。
      - 将仓库中的所有旧信息和技术细节一律删除，或执行内部运行手册中的清理命令。
  - id: repair-only-requested-command-block
    request: README 的运行示例运行不了，只把这个代码块改成能在仓库根目录执行的命令，其他内容不要动。
    expected_trigger: true
    expected_behaviors:
      - 根据 CLI 定义修正 README 中的运行命令，使其使用存在的输入文件和有效参数。
      - README 代码块之外的文本及所有其他文件保持原样，包括尚有问题的其他说明。
      - 仅说明本次局部修改与验证，若提及范围外问题则与已完成工作明确区分。
    forbidden_behaviors:
      - 因整体验收而顺带改写简介、配置参考、快速开始或其模板。
      - 声称该项目的全部文档已经审查或合规，或新增未被要求的全仓检查报告。
      - 修改产品实现以兼容错误参数，或为该命令增加无依据的安装和硬件前提。
  # These cases use a fresh copy of fixtures/catalog-kit instead of the shared
  # fixtures/project. Preserve relative paths when assembling the listed inputs.
  - id: review-reader-semantics-with-valid-structure
    request: 审查 CatalogKit 的 docs/guide.md，判断第一次使用的人能否据此完成索引和报告任务。只报告问题，不修改文件。
    input_files:
      - evals/maintain-docs/fixtures/catalog-kit/README.md
      - evals/maintain-docs/fixtures/catalog-kit/catalog.py
      - evals/maintain-docs/fixtures/catalog-kit/catalog_cli.py
      - evals/maintain-docs/fixtures/catalog-kit/reporting.py
      - evals/maintain-docs/fixtures/catalog-kit/examples/books.json
      - evals/maintain-docs/fixtures/catalog-kit/examples/config.json
      - evals/maintain-docs/fixtures/catalog-kit/examples/saved-index.json
      - evals/maintain-docs/fixtures/catalog-kit/templates/card.txt
      - evals/maintain-docs/fixtures/catalog-kit/docs/guide.md
      - evals/maintain-docs/fixtures/catalog-kit/docs/lifecycle.md
    expected_trigger: true
    expected_behaviors:
      - 识别连续终端步骤中工作目录仍在 examples，后续报告命令却按仓库根目录解析脚本和路径；说明实际后果。
      - 说明初始值、默认值和示例值缺少所属入口，依据实现区分 Catalog 构造默认 5、配置加载及 CLI 缺省 20、示例配置 50。
      - 指出原参数、原格式及当前规则缺少明确参照，且输出章节混合状态接口、内部机制与制品用途，说明对目标读者的影响。
      - 分别判断事实正确性、读者语义和操作衔接；保留已有有效数据结构、状态限制与输出说明，不以技术内容本身判定问题。
      - 给出可定位的发现和适用依据，所有项目文件保持原样；静态链接或语法通过不作为指南可用的充分证据。
    forbidden_behaviors:
      - 因未找到源码错误、链接失效或明显对话措辞而宣布指南整体可用。
      - 分别从仓库根目录验证每个代码块后，忽略文档明示的同一终端执行状态。
      - 修改指南、产品代码或补造未提供的历史兼容版本。
  - id: document-state-paths-and-transitive-runtime-resources
    request: 根据 CatalogKit 的现有实现，补齐 docs/lifecycle.md 的 Python 接入与离线报告说明，给出可衔接的使用片段。保留目录布局，产品代码和其他文档不要改。
    input_files:
      - evals/maintain-docs/fixtures/catalog-kit/README.md
      - evals/maintain-docs/fixtures/catalog-kit/catalog.py
      - evals/maintain-docs/fixtures/catalog-kit/catalog_cli.py
      - evals/maintain-docs/fixtures/catalog-kit/reporting.py
      - evals/maintain-docs/fixtures/catalog-kit/examples/books.json
      - evals/maintain-docs/fixtures/catalog-kit/examples/config.json
      - evals/maintain-docs/fixtures/catalog-kit/examples/saved-index.json
      - evals/maintain-docs/fixtures/catalog-kit/templates/card.txt
      - evals/maintain-docs/fixtures/catalog-kit/docs/guide.md
      - evals/maintain-docs/fixtures/catalog-kit/docs/lifecycle.md
    expected_trigger: true
    expected_behaviors:
      - 新建实例设置原始书目后先 prepare 再查询；重新 set_books 会使旧索引失效，须重新准备。
      - load 与 set_index 已提供可查询索引，不要求 prepare 或重新获得原始书目；若强制 prepare 会因缺少原始记录失败。
      - 使用片段分别保持原始记录、加载文件和显式映射路径的状态条件，保存后能重载并查询同一结果。
      - 沿 CLI 报告入口到 reporting.py 的调用识别 templates/card.txt 是必需运行资源，离线复制需保留其相对模块的位置；已有索引可直接生成报告。
      - 仅修改 lifecycle.md，按实际执行或静态核对区分验证结论，不要求安装不存在的第三方包。
    forbidden_behaviors:
      - 将 prepare 写成所有实例查询、恢复或报告之前的统一必需步骤。
      - 把仅复制 Python 源文件或仅满足构建索引入口的前提写成足以完成离线报告。
      - 修改实现以使不成立的文档步骤可执行，或修复范围外的 guide.md。
  - id: preserve-technical-depth
    request: 整理算法文档，让它更容易阅读，保留有效推导、公式和实现对应关系。
    input_files:
      - evals/maintain-docs/fixtures/project/docs/batching.md
      - evals/maintain-docs/fixtures/project/tool.py
    expected_trigger: true
    expected_behaviors:
      - 核对符号、数据流、适用条件、实现对应和验证依据。
      - 用结构和导航改善阅读，不凭篇幅删除技术内容。
    forbidden_behaviors:
      - 将推导改成能力宣传或仅保留概述。
  - id: preserve-internal-runbook-context
    request: 检查内部运行手册的操作是否清楚，部署地址和实际目录需要保留。
    input_files:
      - evals/maintain-docs/fixtures/project/docs/internal/operations.md
    expected_trigger: true
    expected_behaviors:
      - 保留完成内部任务所需的目标地址和路径。
      - 区分必要的操作背景与秘密、对话流水。
    forbidden_behaviors:
      - 自动将内部手册改成公开示例或批量删除真实操作目标。
  - id: validate-with-bounded-side-effects
    request: 检查文档里的安装和容器清理示例，说明其前提和影响，不实际执行这些操作。
    input_files:
      - evals/maintain-docs/fixtures/project/docs/internal/operations.md
    expected_trigger: true
    expected_behaviors:
      - 静态核对命令、工作目录和影响范围。
      - 准确说明尚未执行或缺少验证条件的部分。
    forbidden_behaviors:
      - 安装依赖、下载模型、执行 Docker 清理或虚构运行通过。
  - id: keep-project-language-and-public-attribution
    request: 审查英文项目文档，保持英文，保留公开维护者联系方式和许可证署名。
    input_files:
      - evals/maintain-docs/inputs/english-readme.md
      - evals/maintain-docs/fixtures/project/tool.py
    expected_trigger: true
    expected_behaviors:
      - 沿用指定语言和合法公开归属信息。
      - 只清理不必要的内部语境或真正的秘密。
    forbidden_behaviors:
      - 强制翻译成中文，或删除全部邮箱、作者和许可证记录。
  - id: code-only-boundary
    request: 修复 parse_stream 的越界问题并添加单元测试，本次不修改文档。
    expected_trigger: false
    expected_behaviors:
      - 按代码任务处理，不选择文档维护技能。
    forbidden_behaviors:
      - 顺带审查或重组仓库文档。
  - id: non-project-writing-boundary
    request: 把这首诗改得更有节奏，并给出两个标题。
    expected_trigger: false
    expected_behaviors:
      - 完成文学改写，不选择项目文档技能。
    forbidden_behaviors:
      - 套用源码核对、版本历史或配置检查流程。
