  - id: review-mixed-paragraph-and-adjacent-repetition
    request: 审查 LabelDock 的 docs/guide.md 的事实、结构与表达。读者理解 CSV、路径和命令行，第一次生成、校验并写出铭牌；README.md、contract.json 和 labels.csv 是依据。仅报告问题，不修改任何文件，不运行产品命令。本次是诊断试验：先发送压缩汇总前的简短已确认发现记录，再独立验收审查报告并形成最终汇总；该记录仅用于比较发现阶段与汇总阶段，不作为固定流程。
    input_files:
      - evals/maintain-docs/fixtures/reader-judgments/alder/README.md
      - evals/maintain-docs/fixtures/reader-judgments/alder/contract.json
      - evals/maintain-docs/fixtures/reader-judgments/alder/labels.csv
      - evals/maintain-docs/fixtures/reader-judgments/alder/docs/guide.md
    expected_trigger: true
    expected_behaviors:
      - 在生成预览段内分别判断必要条件与背景，指出 CLI 已固定 table，SDK 默认 plain 和列名缓存初始化不帮助本入口准备输入或处理后续状态，不能因该段必要而整段保留。
      - 定位写出段的版式缓存初始化说明，说明它不改变写出前提、覆盖选择或成功含义；允许精简或移出，而非要求删除真实技术知识本身。
      - 比较生成段末尾与相邻校验章节的同一预览、pass、校验范围和非打印保证，明确前者重复后者且未增加动作或条件，建议以校验章节为完整说明并保留必要导航。
      - 允许合并发现且不固定条目数，但初始记录和最终报告均须让各处位置、所对应的主线中断或重复关系及具体影响可辨；不能汇总成只有一个位置的笼统技术背景问题。
      - 保留 UTF-8 与两列非空、引号字段、CLI 固定 table、输出路径不存在、新输入须新预览、同一预览 pass、无需原始 CSV、校验能力边界及不可撤销覆盖风险和 HTML 成功边界。
      - 先提供本次诊断记录，再实际独立验收报告并修正成立的遗漏；全部材料保持原样，交付区分静态契约核对与未执行的产品行为。
    forbidden_behaviors:
      - 以全部陈述真实、属于必要章节或全流程相关为由忽略段内信息取舍，或只批评术语多而不说明局部增量。
      - 合并时丢失写出段位置或生成与校验的具体对应关系，或仅列章节名并称重复而不说明重复什么及保留何处。
      - 删除必要条件、把校验写成内容真实性保证、把 HTML 保存写成已打印，或执行产品命令、修改任何材料。
      - 将本次先发记录的诊断安排推广为技能必须新增的固定阶段，或把执行者的新上下文自称为独立验收。
