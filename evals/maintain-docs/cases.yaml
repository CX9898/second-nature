# Manual cases; paths are relative to the repository root.
# fixtures/project is synthetic input with intentional documentation defects.
skill: maintain-docs
fixture: evals/maintain-docs/fixtures/project
cases:
  - id: rewrite-user-facing-release-notes
    request: 将这份发布说明改成用户能直接理解的描述，保留实际使用限制和升级要求。
    input_files:
      - evals/maintain-docs/inputs/release-notes.md
      - evals/maintain-docs/fixtures/project/tool.py
    expected_trigger: true
    expected_behaviors:
      - 说明用户可见行为、触发条件及必要的迁移操作。
      - 去除对话引用、排查流水和仅为内部接续工作保存的信息。
      - 保留正式历史版本与已确认的功能限制。
    forbidden_behaviors:
      - 为每项格式整理和模板同步新增产品公告。
      - 将有限测试扩大为完整兼容性或长期稳定性保证。
  - id: maintain-generic-entrypoint
    request: 更新共享发布目录的 README，要通用一些，发布新版本时不需要反复改它。
    input_files:
      - evals/maintain-docs/inputs/delivery-readme.md
      - evals/maintain-docs/inputs/delivery-contract.json
    expected_trigger: true
    expected_behaviors:
      - 用目录职责、文件用途和稳定操作说明组织内容。
      - 将具体版本兼容要求指向对应产品或环境的权威说明。
      - 按实际消费逻辑区分归档与可选辅助文件。
    forbidden_behaviors:
      - 加入固定的最新版本、镜像数量或整理日期。
      - 给原本可选的元数据增加安装前置要求。
  - id: review-repository-without-edits
    request: 检查整个仓库的文档是否准确、适合读者，仅报告问题，不修改任何文件。
    expected_trigger: true
    expected_behaviors:
      - 区分当前用户文档、模板、历史、技术推导、内部运行手册和第三方材料。
      - 根据源码和配置给出带位置、证据和用户影响的发现。
      - 说明实际检查范围及未验证内容。
    forbidden_behaviors:
      - 修改文件、重组目录或执行文档中的安装与清理命令。
      - 将所有非当前版本的资料都判定为应删除。
  - id: repair-documentation-and-generator-source
    request: 修正仓库用户文档中的错误与表达问题，保留现有目录布局，并让生成的快速开始在下次生成后仍正确。
    expected_trigger: true
    expected_behaviors:
      - 核对 CLI、执行目录和实例初始值、配置缺省值、示例显式值的区别。
      - 修改快速开始的模板并同步生成物及相关引用。
      - 保留算法推导、正式历史、ADR 和第三方归属。
    forbidden_behaviors:
      - 只改生成结果，或修改产品实现来迎合错误文档。
      - 更改项目版本、许可证、忽略规则或无关源码。
  - id: complete-maintenance-beyond-reported-issue
    request: 我发现 README 的运行命令可能不对。请把整个仓库面向用户的文档检查并整理好，保留现有目录布局；docs/internal/、docs/adr/、vendor/ 和 CHANGELOG.md 保持原样。
    expected_trigger: true
    expected_behaviors:
      - 修正 README 命令和失效导航，并继续检查未被用户点名的快速开始、配置参考及生成模板。
      - 配置说明准确区分构造初始值、配置缺省值、命令行覆盖顺序与示例显式值。
      - 快速开始及模板说明实际输出文件和成功条件，用户正文不保留工作接续或机器特定结论。
      - 保留有效批次推导和资源边界，最终文档的任务路径、事实与表达彼此一致。
      - 交付时区分实际完成的检查与未验证内容，不将修复命令或静态检查通过等同于整篇合格。
    forbidden_behaviors:
      - 只处理用户提示的 README 命令，遗漏其他用户文档中的已可核实问题后宣布整体完成。
      - 修改排除目录、正式历史、产品代码、项目版本或许可证。
      - 将仓库中的所有旧信息和技术细节一律删除，或执行内部运行手册中的清理命令。
  - id: repair-only-requested-command-block
    request: README 的运行示例运行不了，只把这个代码块改成能在仓库根目录执行的命令，其他内容不要动。
    expected_trigger: true
    expected_behaviors:
      - 根据 CLI 定义修正 README 中的运行命令，使其使用存在的输入文件和有效参数。
      - README 代码块之外的文本及所有其他文件保持原样，包括尚有问题的其他说明。
      - 仅说明本次局部修改与验证，若提及范围外问题则与已完成工作明确区分。
    forbidden_behaviors:
      - 因整体验收而顺带改写简介、配置参考、快速开始或其模板。
      - 声称该项目的全部文档已经审查或合规，或新增未被要求的全仓检查报告。
      - 修改产品实现以兼容错误参数，或为该命令增加无依据的安装和硬件前提。
  # These cases use a fresh copy of fixtures/catalog-kit instead of the shared
  # fixtures/project. Preserve relative paths when assembling the listed inputs.
  - id: review-reader-semantics-with-valid-structure
    request: 审查 CatalogKit 的 docs/guide.md，判断第一次使用的人能否据此完成索引和报告任务。只报告问题，不修改文件。
    input_files:
      - evals/maintain-docs/fixtures/catalog-kit/README.md
      - evals/maintain-docs/fixtures/catalog-kit/catalog.py
      - evals/maintain-docs/fixtures/catalog-kit/catalog_cli.py
      - evals/maintain-docs/fixtures/catalog-kit/reporting.py
      - evals/maintain-docs/fixtures/catalog-kit/examples/books.json
      - evals/maintain-docs/fixtures/catalog-kit/examples/config.json
      - evals/maintain-docs/fixtures/catalog-kit/examples/saved-index.json
      - evals/maintain-docs/fixtures/catalog-kit/templates/card.txt
      - evals/maintain-docs/fixtures/catalog-kit/docs/guide.md
      - evals/maintain-docs/fixtures/catalog-kit/docs/lifecycle.md
    expected_trigger: true
    expected_behaviors:
      - 识别连续终端步骤中工作目录仍在 examples，后续报告命令却按仓库根目录解析脚本和路径；说明实际后果。
      - 说明初始值、默认值和示例值缺少所属入口，依据实现区分 Catalog 构造默认 5、配置加载及 CLI 缺省 20、示例配置 50。
      - 指出原参数、原格式及当前规则缺少明确参照，且输出章节混合状态接口、内部机制与制品用途，说明对目标读者的影响。
      - 分别判断事实正确性、读者语义和操作衔接；保留已有有效数据结构、状态限制与输出说明，不以技术内容本身判定问题。
      - 给出可定位的发现和适用依据，所有项目文件保持原样；静态链接或语法通过不作为指南可用的充分证据。
    forbidden_behaviors:
      - 因未找到源码错误、链接失效或明显对话措辞而宣布指南整体可用。
      - 分别从仓库根目录验证每个代码块后，忽略文档明示的同一终端执行状态。
      - 修改指南、产品代码或补造未提供的历史兼容版本。
  - id: document-state-paths-and-transitive-runtime-resources
    request: 根据 CatalogKit 的现有实现，补齐 docs/lifecycle.md 的 Python 接入与离线报告说明，给出可衔接的使用片段。保留目录布局，产品代码和其他文档不要改。
    input_files:
      - evals/maintain-docs/fixtures/catalog-kit/README.md
      - evals/maintain-docs/fixtures/catalog-kit/catalog.py
      - evals/maintain-docs/fixtures/catalog-kit/catalog_cli.py
      - evals/maintain-docs/fixtures/catalog-kit/reporting.py
      - evals/maintain-docs/fixtures/catalog-kit/examples/books.json
      - evals/maintain-docs/fixtures/catalog-kit/examples/config.json
      - evals/maintain-docs/fixtures/catalog-kit/examples/saved-index.json
      - evals/maintain-docs/fixtures/catalog-kit/templates/card.txt
      - evals/maintain-docs/fixtures/catalog-kit/docs/guide.md
      - evals/maintain-docs/fixtures/catalog-kit/docs/lifecycle.md
    expected_trigger: true
    expected_behaviors:
      - 新建实例设置原始书目后先 prepare 再查询；重新 set_books 会使旧索引失效，须重新准备。
      - load 与 set_index 已提供可查询索引，不要求 prepare 或重新获得原始书目；若强制 prepare 会因缺少原始记录失败。
      - 使用片段分别保持原始记录、加载文件和显式映射路径的状态条件，保存后能重载并查询同一结果。
      - 沿 CLI 报告入口到 reporting.py 的调用识别 templates/card.txt 是必需运行资源，离线复制需保留其相对模块的位置；已有索引可直接生成报告。
      - 仅修改 lifecycle.md，按实际执行或静态核对区分验证结论，不要求安装不存在的第三方包。
    forbidden_behaviors:
      - 将 prepare 写成所有实例查询、恢复或报告之前的统一必需步骤。
      - 把仅复制 Python 源文件或仅满足构建索引入口的前提写成足以完成离线报告。
      - 修改实现以使不成立的文档步骤可执行，或修复范围外的 guide.md。
  # The next cases use a fresh copy of fixtures/parcel-desk. For either handoff
  # case, copy only its selected input into case-inputs/handoff.md in that copy.
  # The two handoffs contain the same facts; compare format with inputs fixed.
  - id: review-short-contract-composition
    request: 审查 ParcelDesk 的 docs/usage.md，判断示例数据能否按所述流程完成分组与检查。只报告问题，不修改文件。
    input_files:
      - evals/maintain-docs/fixtures/parcel-desk/README.md
      - evals/maintain-docs/fixtures/parcel-desk/parcel.py
      - evals/maintain-docs/fixtures/parcel-desk/docs/usage.md
      - evals/maintain-docs/fixtures/parcel-desk/docs/architecture.md
      - evals/maintain-docs/fixtures/parcel-desk/examples/parts.csv
      - evals/maintain-docs/fixtures/parcel-desk/examples/part-checks.csv
      - evals/maintain-docs/fixtures/parcel-desk/examples/parcel-checks.csv
    expected_trigger: true
    expected_behaviors:
      - 沿零件记录、按编号分组的包裹、检查值和检查接口核对计数单位，识别首个片段的零件检查值不能直接作为包裹检查值。
      - 用示例或实现说明分组后为两个包裹，而 part-checks 产生三个检查值，会触发数量校验失败。
      - 保留省略检查值仍可统计包裹数的有效路径，以及按包裹提供检查值的替代路径，不将检查结果写成普遍前提。
      - 报告能定位的组合缺口，区分各函数分别成立与示例端到端成立；输入文件均保持原样。
    forbidden_behaviors:
      - 因两个读取函数均按各自契约工作、命令能解析或小项目上下文较短而认定示例正确。
      - 修改实现以广播、截断或自动汇总检查值，或要求所有调用都准备检查文件。
      - 修复范围外架构图或将单个反例扩大为所有有检查值的路径都不可用。
  - id: integrate-narrative-handoff
    request: 根据 case-inputs/handoff.md 的交接材料核对并修正 docs/architecture.md，使保存、恢复和展示流程一致；需要时对照实现。保留目录布局，仅修改这份文档。
    input_files:
      - evals/maintain-docs/fixtures/parcel-desk/README.md
      - evals/maintain-docs/fixtures/parcel-desk/parcel.py
      - evals/maintain-docs/fixtures/parcel-desk/docs/usage.md
      - evals/maintain-docs/fixtures/parcel-desk/docs/architecture.md
      - evals/maintain-docs/fixtures/parcel-desk/examples/parts.csv
      - evals/maintain-docs/fixtures/parcel-desk/examples/part-checks.csv
      - evals/maintain-docs/fixtures/parcel-desk/examples/parcel-checks.csv
      - evals/maintain-docs/inputs/parcel-handoff-narrative.md
    expected_trigger: true
    expected_behaviors:
      - 根据内容契约区分两种 SQLite 产物：恢复读取 parts 表的零件详情，展示读取 counts 表的计数；不能仅凭容器格式认定可互换。
      - 图和正文共同表达完整检查点到恢复、汇总到展示的关系，交接内容与最终成稿一致。
      - 保留无需重新提供原始 CSV 即可恢复的有效路径，且单纯展示不被增加完整检查点前提。
      - 仅修改 architecture.md，不能以交接者已核对或本地链接有效代替最终数据流验收。
    forbidden_behaviors:
      - 沿用展示汇总直接恢复完整分组的图示，或只修改正文却保留与其冲突的图。
      - 给所有消费者一律连接全部输出材料，或删除有效展示路径来消除冲突。
      - 改动产品代码、其他文档或交接材料。
  - id: integrate-contract-handoff
    request: 根据 case-inputs/handoff.md 的交接材料核对并修正 docs/architecture.md，使保存、恢复和展示流程一致；需要时对照实现。保留目录布局，仅修改这份文档。
    input_files:
      - evals/maintain-docs/fixtures/parcel-desk/README.md
      - evals/maintain-docs/fixtures/parcel-desk/parcel.py
      - evals/maintain-docs/fixtures/parcel-desk/docs/usage.md
      - evals/maintain-docs/fixtures/parcel-desk/docs/architecture.md
      - evals/maintain-docs/fixtures/parcel-desk/examples/parts.csv
      - evals/maintain-docs/fixtures/parcel-desk/examples/part-checks.csv
      - evals/maintain-docs/fixtures/parcel-desk/examples/parcel-checks.csv
      - evals/maintain-docs/inputs/parcel-handoff-contracts.md
    expected_trigger: true
    expected_behaviors:
      - 根据内容契约区分两种 SQLite 产物：恢复读取 parts 表的零件详情，展示读取 counts 表的计数；不能仅凭容器格式认定可互换。
      - 图和正文共同表达完整检查点到恢复、汇总到展示的关系，交接内容与最终成稿一致。
      - 保留无需重新提供原始 CSV 即可恢复的有效路径，且单纯展示不被增加完整检查点前提。
      - 仅修改 architecture.md，不能以交接者已核对或本地链接有效代替最终数据流验收。
    forbidden_behaviors:
      - 沿用展示汇总直接恢复完整分组的图示，或只修改正文却保留与其冲突的图。
      - 给所有消费者一律连接全部输出材料，或删除有效展示路径来消除冲突。
      - 改动产品代码、其他文档或交接材料。
  - id: preserve-technical-depth
    request: 整理算法文档，让它更容易阅读，保留有效推导、公式和实现对应关系。
    input_files:
      - evals/maintain-docs/fixtures/project/docs/batching.md
      - evals/maintain-docs/fixtures/project/tool.py
    expected_trigger: true
    expected_behaviors:
      - 核对符号、数据流、适用条件、实现对应和验证依据。
      - 用结构和导航改善阅读，不凭篇幅删除技术内容。
    forbidden_behaviors:
      - 将推导改成能力宣传或仅保留概述。
  # Use a fresh copy of fixtures/brief-export for this case. README and schema
  # are the supplied behavior contract, not targets for editing.
  - id: edit-for-local-reader-knowledge
    request: 整理 BriefExport 的导出指南和示例配置说明，面向第一次导出文本的读者。功能事实以 README.md 和 export.schema.json 的现有契约为准，只修改 docs/export.md 和 examples/export.json，不运行安装或导出。
    input_files:
      - evals/maintain-docs/fixtures/brief-export/README.md
      - evals/maintain-docs/fixtures/brief-export/export.schema.json
      - evals/maintain-docs/fixtures/brief-export/docs/export.md
      - evals/maintain-docs/fixtures/brief-export/examples/export.json
    expected_trigger: true
    expected_behaviors:
      - 将示例 JSON 中面向读者的配置说明纳入整理，删除与开关选择无关的搜索索引背景，保留开关方向和覆盖风险。
      - 去除导出主线中的搜索实现及未暴露的缓冲区配置话题，不靠补充倒排表或缓冲区术语定义保留这些无关内容。
      - 让重新读取、修改设置和再次导出的说明连续；私密笔记的完整说明保留在需要它的位置，消除无增量的相邻重复。
      - 保留必要的 NotesVault 输入关联，说明记录文件与内部数据库的区别、输入格式、路径解析方式及包含私密内容的影响。
      - 仅编辑两个目标文件，不改变配置键值、默认行为及输入输出契约。
    forbidden_behaviors:
      - 只检查 Markdown，遗漏配置注释中的同类问题，或将无关背景仅换成更短术语和链接。
      - 将用户视角解释为删除所有跨模块说明、必要默认值、隐私限制或覆盖警告。
      - 为保存每句技术事实而新增搜索章节、缓冲区配置说明或其他文件，或更改源契约以迎合文档。
  # Use a fresh copy of fixtures/report-mint. Evaluators receive this case's
  # natural request and raw files, not the expected or forbidden behaviors.
  - id: edit-state-constraints-for-current-entrypoint
    request: 整理 ReportMint 的 README.md、examples/report.json 和 docs/session-api.md，使说明准确、清楚。
    input_files:
      - evals/maintain-docs/fixtures/report-mint/README.md
      - evals/maintain-docs/fixtures/report-mint/contract.json
      - evals/maintain-docs/fixtures/report-mint/examples/report.json
      - evals/maintain-docs/fixtures/report-mint/docs/session-api.md
    expected_trigger: true
    expected_behaviors:
      - 依据 README 的首次 CLI 使用任务判断配置注释，区分每次新建会话的入口与复用 SDK 会话的操作路径。
      - 配置字段保留窗口长度的分钟单位、正整数约束和默认值，具体 SDK 重配调用由已有会话指南承接，不在字段旁新增术语解释或同义操作流程。
      - SDK 指南保留加载或改值使窗口失效、重新准备后再写出、未准备时的错误行为，以及未改值时直接复用窗口的有效路径。
      - 保留路径基准、输出目录、UTC、覆盖不可撤销与既有报表不自动更新的条件；配置值及权威契约保持不变。
      - 检查实际改写和知识保留，交付区分静态契约核对与产品运行，不虚构不存在的实现或运行结果。
    forbidden_behaviors:
      - 仅因 SDK 状态约束真实且重要，就在 CLI 配置注释保留完整调用顺序，或将其换写到另一个同样不服务该任务的相邻位置。
      - 以清理配置说明为由删除 SDK 当前任务必需的调用对象、顺序和状态条件，或把重新准备写成每次写出之前的普遍要求。
      - 修改配置行为值、接口契约或虚构 CLI 需要手工操作已存在的会话。
  # These two cases use separate fresh copies of fixtures/pack-trail with the
  # same inputs and reader assumptions. Compare review and editing separately.
  - id: review-related-content-at-local-scope
    request: 审查 PackTrail 的 docs/backup.md 和 examples/backup.json 的事实、结构与表达。读者第一次用 PackTrail 为本地目录创建并校验备份，理解文件路径和命令行，但不了解归档内部格式；已有 README.md 和 contract.json 可作依据。仅报告问题，不修改文件，不运行产品命令。
    input_files:
      - evals/maintain-docs/fixtures/pack-trail/README.md
      - evals/maintain-docs/fixtures/pack-trail/contract.json
